  --ok:#5CC08B; --ok-bg:#183326; --warn:#E8B04B; --warn-bg:#382C12; --bad:#F2796B; --bad-bg:#3D1C19; --info:#78AEE3; --info-bg:#172A3D;

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:14px 0 4px;scrollbar-width:none}
.seg a{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600}
.seg a.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.back{display:inline-flex;gap:4px;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:8px}
dl.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

const DEFAULT_SETTINGS = { weekend: "fri", buffer: 3, look: 14, holidays: ["2027-01-07","2027-01-25","2027-04-25","2027-05-01","2027-06-30","2027-07-23"] };

/* ---------- state + storage ---------- */
let state = { settings: clone(DEFAULT_SETTINGS), crews: [], projects: [] };
let loaded = false;
const LS_KEY = "siteboard-v1";
const IS_APP = !!(window.Android && typeof window.Android.saveFile === "function");
const store = {
  mode: "loading", col: null, queues: {}, timer: null, stale: false, readonly: false,
  async init() {
    let db = null, user = null, id = null;
    try {
      if (!IS_APP && window.claude && typeof window.claude.use === "function") {
        [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        id = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (db && id) {
      this.mode = "cloud";
      this.col = db.collection("data/users/" + id);
      this.timer = setTimeout(() => { this.stale = true; render(); }, 10000);
      this.col.onSnapshot(snap => {
        const next = { settings: clone(DEFAULT_SETTINGS), crews: [], projects: [] };
        snap.docs.forEach(d => {
          const v = d.data(); if (!v) return;
          if (d.id === "settings") next.settings = Object.assign(clone(DEFAULT_SETTINGS), v);
          else if (d.id === "crews") next.crews = Array.isArray(v.list) ? clone(v.list) : [];
          else if (d.id.startsWith("p-")) next.projects.push(clone(v));
        });
        next.projects.sort((a, b) => String(a.code).localeCompare(String(b.code)));
        state = next;
        if (!snap.metadata.fromCache) { clearTimeout(this.timer); this.stale = false; }
        loaded = true; render();
      }, err => {
        clearTimeout(this.timer); this.stale = false;
        this.readonly = true; loaded = true;
        toast(t("Your saved data can't be reached right now. Changes won't be saved."));
        render();
      });
    } else {
      this.mode = "local";
      try { const raw = localStorage.getItem(LS_KEY); if (raw) { const v = JSON.parse(raw); state = Object.assign({ settings: clone(DEFAULT_SETTINGS), crews: [], projects: [] }, v); } } catch (e) {}
      loaded = true; render();
    }
  },
  saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { toast(t("This browser isn't saving data. Export a backup from Setup.")); } },
  write(key, data) {
    if (this.readonly) { toast(t("Not saved: your data can't be reached right now.")); return Promise.resolve(); }
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    if (JSON.stringify(data).length > 240000) toast(t("This project is getting very large. Export a backup soon."));
    const run = () => this.col.doc(key).set(data).catch(e => {
      if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 800 + Math.random() * 800)).then(() => this.col.doc(key).set(data));
      throw e;
    }).catch(e => {
      if (e && e.code === "invalid_argument") { this.readonly = true; toast(t("You can view this app but not save to it. Ask the owner for Contributor access.")); render(); }
      else toast(t("Couldn't save. Check your connection and try again."));
    });
    this.queues[key] = (this.queues[key] || Promise.resolve()).then(run);
    return this.queues[key];
  },
  remove(key) {
    if (this.mode === "local") { this.saveLocal(); return Promise.resolve(); }
    this.queues[key] = (this.queues[key] || Promise.resolve()).then(() => this.col.doc(key).delete()).catch(() => toast(t("Couldn't delete. Try again.")));
    return this.queues[key];
  }
};
const saveProject = p => { compute(); render(); return store.write("p-" + p.id, p); };

/* ---------- calculations ---------- */
let HOL = new Set(), C = { p: {}, tasks: [], mats: [] };
function isWork(d) {
  const w = new Date(d * 864e5).getUTCDay();
  if (w === 5) return false;
  if (w === 6 && state.settings.weekend === "frisat") return false;
  return !HOL.has(d);
}
function finishOf(t) {
  if (!t.start || !num(t.dur)) return null;
  let d = D(t.start), n = Math.max(1, Math.round(num(t.dur))) - 1;
  while (n > 0) { d++; if (isWork(d)) n--; }
  return d;
}
function taskCalc(t) {
  const fin = finishOf(t), done = num(t.pct) >= 100 || !!t.afinish;
  let st = "Not Started";
  if (done) st = "Done";
  else if (fin != null && fin < TODAY) st = "Overdue";
  else if (t.astart) st = "In Progress";
  else if (t.start && D(t.start) < TODAY) st = "Late Start";
  let late = 0;
  if (fin != null) late = done ? (t.afinish ? Math.max(0, D(t.afinish) - fin) : 0) : Math.max(0, TODAY - fin);
  return { fin, st, late, eff: done ? 1 : Math.min(1, num(t.pct) / 100), clash: false, clashWith: [] };
}
function matCalc(p, m, buffer) {
  let needed = m.neededManual || null;
  if (!needed && m.task) { const t = (p.tasks || []).find(x => x.tid === m.task); if (t && t.start) needed = t.start; }
  const nd = D(needed), orderBy = (nd != null && has(m.lead)) ? nd - num(m.lead) - buffer : null;
  const total = has(m.qty) && has(m.price) ? num(m.qty) * num(m.price) : 0;
  let st = "Planned";
  if (m.deliveredOn) st = (num(m.qty) > 0 && num(m.qtyDel) < num(m.qty)) ? "Part Delivered" : "Delivered";
  else if (m.orderedOn) st = (nd != null && TODAY > nd) ? "LATE DELIVERY" : "Ordered";
  else if (orderBy == null) st = "Set dates";
  else if (TODAY > orderBy) st = "LATE TO ORDER";
  else if (orderBy - TODAY <= 7) st = "ORDER NOW";
  const left = (orderBy != null && !m.orderedOn && !m.deliveredOn) ? orderBy - TODAY : null;
  return { needed: nd, orderBy, total, st, left, onSite: has(m.qtyDel) ? num(m.qtyDel) - num(m.qtyUsed) : null,
           toPay: m.orderedOn ? total - num(m.paid) : 0 };
}
function payCalc(p, y) {
  const ret = num(y.amount) * num(p.retention) / 100, net = num(y.amount) - ret;
  const due = y.date ? D(y.date) + num(p.terms) : null, out = net - num(y.received);
  let st = "Not Due";
  if (out <= 0) st = "Paid"; else if (due != null && TODAY > due) st = "Overdue"; else if (num(y.received) > 0) st = "Part Paid";
  return { ret, net, due, out, st, daysOver: st === "Overdue" ? TODAY - due : 0 };
}
function compute() {
  HOL = new Set((state.settings.holidays || []).map(D).filter(x => x != null));
  const buffer = num(state.settings.buffer);
  C = { p: {}, tasks: [], mats: [] };
  for (const p of state.projects) {
    const tk = (p.tasks || []).map(t => ({ t, ...taskCalc(t), p }));
    const mt = (p.materials || []).map(m => ({ m, ...matCalc(p, m, buffer), p }));
    const py = (p.payments || []).map(y => ({ y, ...payCalc(p, y) }));
    C.tasks.push(...tk); C.mats.push(...mt);
    C.p[p.id] = { tk, mt, py };
  }
  // crew clashes across all projects
  const open = C.tasks.filter(x => x.t.crew && x.st !== "Done" && x.t.start && x.fin != null);
  for (let i = 0; i < open.length; i++) for (let j = i + 1; j < open.length; j++) {
    const a = open[i], b = open[j];
    if (a.t.crew === b.t.crew && D(a.t.start) <= b.fin && D(b.t.start) <= a.fin) {
      a.clash = b.clash = true; a.clashWith.push(b); b.clashWith.push(a);
    }
  }
  for (const p of state.projects) {
    const c = C.p[p.id], tk = c.tk;

    const progress = sumDur ? tk.reduce((s, x) => s + num(x.t.dur) * x.eff, 0) / sumDur : 0;
    const vos = p.vos || [], costs = p.costs || [], daily = p.daily || [];
    const ext = vos.filter(v => v.status === "Approved").reduce((s, v) => s + num(v.apprExt), 0);
    const ho = D(p.handover), rev = ho != null ? ho + ext : null;
    const forecast = tk.reduce((m, x) => x.fin != null && (m == null || x.fin > m) ? x.fin : m, null);
    const overdue = tk.filter(x => x.st === "Overdue").length, late = tk.filter(x => x.st === "Late Start").length;
    const clashes = tk.filter(x => x.clash).length;
    let sched = "On Track";
    if (p.status === "Handed Over") sched = "Handed Over";
    else if (rev != null && forecast != null && forecast > rev) sched = "AT RISK";
    else if (overdue + late > 0) sched = "Delays";
    const voAppr = vos.filter(v => v.status === "Approved").reduce((s, v) => s + num(v.apprValue), 0);
    const revised = num(p.contract) + voAppr;
    const earned = revised * progress;
    const invoiced = c.py.reduce((s, x) => s + num(x.y.amount), 0), received = c.py.reduce((s, x) => s + num(x.y.received), 0);
    const outstanding = c.py.reduce((s, x) => s + x.out, 0), retention = c.py.reduce((s, x) => s + x.ret, 0);
    const overdueInv = c.py.filter(x => x.st === "Overdue").reduce((s, x) => s + x.out, 0);
    const costBy = cat => costs.filter(k => k.cat === cat).reduce((s, k) => s + num(k.amount), 0);
    const mat = c.mt.filter(x => x.m.orderedOn).reduce((s, x) => s + x.total, 0);
    const lab = costBy("Labour"), sub = costBy("Subcontractor"), eq = costBy("Equipment");
    const oth = costs.reduce((s, k) => s + num(k.amount), 0) - lab - sub - eq;
    const total = mat + lab + sub + eq + oth;
    const budget = ["bMat","bLab","bSub","bEq","bOth"].reduce((s, k) => s + num(p[k]), 0);
    const paidOut = costs.reduce((s, k) => s + num(k.paid), 0) + (p.materials || []).reduce((s, m) => s + num(m.paid), 0);
    const owed = costs.reduce((s, k) => s + (num(k.amount) - num(k.paid)), 0) + c.mt.reduce((s, x) => s + x.toPay, 0);
    const lastR = daily.reduce((m, r) => r.date && (m == null || D(r.date) > m) ? D(r.date) : m, null);
    const manpower = lastR == null ? 0 : daily.filter(r => D(r.date) === lastR).reduce((s, r) => s + num(r.own) + num(r.sub), 0);
    Object.assign(c, {
      progress, ext, rev, forecast, overdue, late, clashes, sched,
      daysTo: rev != null ? rev - TODAY : null, done: tk.filter(x => x.st === "Done").length,
      voAppr, revised, voPend: vos.filter(v => v.status === "Submitted").length,
      voPendVal: vos.filter(v => v.status === "Submitted").reduce((s, v) => s + num(v.value), 0),
      earned, invoiced, received, outstanding, retention, overdueInv, notInvoiced: Math.max(0, earned - invoiced),
      mat, lab, sub, eq, oth, total, budget, budgetUsed: budget ? total / budget : 0, paidOut, owed,
      cash: received - paidOut, profit: earned - total,
      lastR, daysSince: lastR == null ? null : TODAY - lastR, manpower,
      hours: daily.reduce((s, r) => s + num(r.hours), 0), issues: daily.filter(r => r.issueStatus === "Open").length,
      toOrder: c.mt.filter(x => x.st === "ORDER NOW" || x.st === "LATE TO ORDER").length,
      lateDel: c.mt.filter(x => x.st === "LATE DELIVERY").length
    });
  }
}

function alerts() {
  const a = [];
  for (const p of state.projects) {
    const c = C.p[p.id];
    if (c.sched === "AT RISK") a.push({ s: 3, t: t("{name}: handover at risk", { name: p.name }), sub: t("Last task ends {a}, handover {b}", { a: fdn(c.forecast), b: fdn(c.rev) }), go: `#p-${p.id}-tasks` });
    if (missingReport(p)) a.push({ s: 2, t: t("{code}: no daily report", { code: p.code }), sub: c.lastR == null ? t("No reports yet") : t("Last report {d} ({n} days ago)", { d: fdn(c.lastR), n: c.daysSince }), go: `#p-${p.id}-daily` });
    for (const x of c.py) if (x.st === "Overdue") a.push({ s: 3, t: t("Invoice {no} unpaid", { no: x.y.no || "" }), sub: t("{code} · {amt} EGP · {n} days overdue", { code: p.code, amt: egp(x.out), n: x.daysOver }), go: `#p-${p.id}-payments` });
    for (const v of p.vos || []) if (v.status === "Submitted" && v.date && TODAY - D(v.date) > 7) a.push({ s: 1, t: t("Variation {no} waiting {n} days", { no: v.no || "", n: TODAY - D(v.date) }), sub: `${p.code} · ${v.desc || ""} · ${t("{a} EGP", { a: egp(v.value) })}`, go: `#p-${p.id}-vos` });
  }
  for (const x of C.tasks) {
    if (x.st === "Overdue") a.push({ s: 3, t: t("Overdue: {t}", { t: x.t.desc }), sub: t("{code} · {crew} · {n} days late", { code: x.p.code, crew: x.t.crew || t("No crew"), n: x.late }), go: `#p-${x.p.id}-tasks` });
    else if (x.st === "Late Start") a.push({ s: 2, t: t("Not started: {t}", { t: x.t.desc }), sub: t("{code} · planned {d}", { code: x.p.code, d: fd(x.t.start) }), go: `#p-${x.p.id}-tasks` });
  }
  const seen = new Set();
  for (const x of C.tasks) if (x.clash) {
    const key = x.t.crew; if (seen.has(key)) continue; seen.add(key);
    const group = C.tasks.filter(y => y.clash && y.t.crew === key);
    a.push({ s: 3, t: t("Crew clash: {crew}", { crew: key }), sub: group.map(y => `${y.p.code} ${y.t.tid || ""} (${fd(y.t.start)}–${fdn(y.fin)})`).join(" · "), go: "#crews" });
  }
  for (const x of C.mats) {
    if (x.st === "LATE TO ORDER") a.push({ s: 3, t: t("Order now: {i}", { i: x.m.item }), sub: t("{code} · last day was {a} · needed {b}", { code: x.p.code, a: fdn(x.orderBy), b: fdn(x.needed) }), go: `#p-${x.p.id}-materials` });
    else if (x.st === "LATE DELIVERY") a.push({ s: 3, t: t("Late delivery: {i}", { i: x.m.item }), sub: t("{code} · needed {a} · {s}", { code: x.p.code, a: fdn(x.needed), s: x.m.supplier || "" }), go: `#p-${x.p.id}-materials` });
    else if (x.st === "ORDER NOW") a.push({ s: 2, t: t("Order this week: {i}", { i: x.m.item }), sub: t("{code} · order by {a} ({n} days left)", { code: x.p.code, a: fdn(x.orderBy), n: x.left }), go: `#p-${x.p.id}-materials` });
  }
  return a.sort((x, y) => y.s - x.s);
}

function viewMoney() {

  }
  const keys = Object.keys(months).sort(); let cum = 0;

  let h = `<a class="back" href="#home">${t("← Overview")}</a><h1>${t("Money")}</h1><p class="sub">${t("All projects, EGP. Money in = client payments received; money out = costs and materials paid.")}</p>

  }
  openForm(kind, values, { pid,
    onSave: v => { const arr = p[list] = p[list] || []; if (!v.id) { v.id = uid(); arr.push(v); } else { const i = arr.findIndex(x => x.id === v.id); arr[i] = v; } saveProject(p); toast(t("Saved")); },
    onDelete: item ? () => { p[list] = p[list].filter(x => x.id !== id); saveProject(p); toast(t("Deleted")); } : null });
}
function editProject(pid) {
  const p = pid ? proj(pid) : null;
  const values = p ? clone(p) : { status: "Active", scope: "MEP + Finishes", retention: 5, terms: 30, start: TODAY_S };
  openForm("project", values, { onSave: v => {
    if (!p) {
      const n = state.projects.reduce((m, x) => Math.max(m, parseInt(String(x.code).replace(/\D/g, "")) || 0), 0);
      Object.assign(v, { id: uid(), code: "P" + String(n + 1).padStart(2, "0"), tasks: [], materials: [], vos: [], payments: [], costs: [], daily: [] });
      state.projects.push(v); saveProject(v); location.hash = "#p-" + v.id; toast(t("Project added"));
    } else { const i = state.projects.findIndex(x => x.id === p.id); state.projects[i] = v; saveProject(v); toast(t("Saved")); }
  } });
}
function editCrew(id) {
  const k = id ? state.crews.find(x => x.id === id) : null;
  openForm("crew", k ? clone(k) : { type: "Own Crew" }, {
    onSave: v => {
      if (!k) { v.id = uid(); state.crews.push(v); saveCrews(); }
      else {
        const old = k.name; Object.assign(k, v);
        if (old !== v.name) state.projects.forEach(p => { let ch = false; (p.tasks || []).forEach(t => { if (t.crew === old) { t.crew = v.name; ch = true; } }); if (ch) store.write("p-" + p.id, p); });
        saveCrews();
      }
      toast(t("Saved"));
    },
    onDelete: k ? () => { state.crews = state.crews.filter(x => x.id !== id); saveCrews(); toast(t("Deleted")); } : null });
}

/* ---------- actions ---------- */
async function loadSample() {
  const s = clone(SAMPLE);
  const names = new Set(state.crews.map(k => k.name));
  s.crews.forEach(k => { if (!names.has(k.name)) state.crews.push(k); });
  for (const p of s.projects) {
    if (state.projects.some(x => x.id === p.id)) continue;
    const n = state.projects.reduce((m, x) => Math.max(m, parseInt(String(x.code).replace(/\D/g, "")) || 0), 0);
    p.code = "P" + String(n + 1).padStart(2, "0");
    state.projects.push(p);
  }
  compute(); render();
  await store.write("crews", { list: state.crews });
  for (const p of s.projects) { const q = proj(p.id); if (q) await store.write("p-" + q.id, q); }
  toast(t("Sample projects loaded. Edit or delete them any time."));
}
async function exportBackup() {
  const data = JSON.stringify({ app: "SiteBoard", version: 1, exported: TODAY_S, ...state }, null, 1);
  if (IS_APP) { const where = window.Android.saveFile(`siteboard-backup-${TODAY_S}.json`, data); if (where) { toast(t("Backup saved to {p}", { p: where })); return; } }
  let dl = null; try { dl = IS_APP ? null : await window.claude?.use?.("downloads"); } catch (e) {}
  if (dl) {
    try { await dl.save({ filename: `siteboard-backup-${TODAY_S}.json`, data }); toast(t("Backup saved")); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  $("#exportBox").innerHTML = `<div class="form" style="margin-top:10px"><div class="f"><label for="exportText">${t("Copy this text and keep it somewhere safe")}</label><textarea id="exportText" rows="6" readonly dir="ltr">${esc(data)}</textarea></div></div><div class="btns"><button class="btn" data-act="copyExport">${t("Copy")}</button></div>`;
}
async function importBackup(text) {
  let v; try { v = JSON.parse(text); } catch (e) { toast(t("That file isn't a SiteBoard backup.")); return; }
  if (!v || !Array.isArray(v.projects) || !Array.isArray(v.crews)) { toast(t("That file isn't a SiteBoard backup.")); return; }
  const old = state.projects.map(p => p.id);
  state = { settings: Object.assign(clone(DEFAULT_SETTINGS), v.settings || {}), crews: v.crews, projects: v.projects };
  compute(); render();
  await store.write("settings", state.settings); await store.write("crews", { list: state.crews });
  for (const p of state.projects) await store.write("p-" + p.id, p);
  for (const id of old) if (!state.projects.some(p => p.id === id)) await store.remove("p-" + id);
  toast(t("Backup restored: {n} projects", { n: state.projects.length }));
}
async function wipe() {
  const ids = state.projects.map(p => p.id);
  state = { settings: clone(DEFAULT_SETTINGS), crews: [], projects: [] }; compute(); location.hash = "#home"; render();
  for (const id of ids) await store.remove("p-" + id);
  await store.remove("crews"); await store.remove("settings");
  if (store.mode === "local") store.saveLocal();
  toast(t("All data deleted"));
}
let armedBtn = null;
function twoTap(btn, fn) {
  if (armedBtn === btn) { armedBtn = null; fn(); return; }
  armedBtn = btn; const txt = btn.textContent; btn.classList.add("armed"); btn.textContent = t("Tap again to confirm");
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = txt; } if (armedBtn === btn) armedBtn = null; }, 3500);
}

/* ---------- routing + events ---------- */
const ui = { projFilter: "active", tlMode: "open" };
function route() { return (location.hash || "#home").slice(1); }
function render() {
  $("#today").innerHTML = `${DAYS[LANG][new Date(TODAY * 864e5).getUTCDay()]}<br>${fd(TODAY_S)}`;
  if (!loaded) return;
  compute();
  const r = route(); let html = "", tab = "home";
  if (r === "projects") { html = viewProjects(); tab = "projects"; }
  else if (r.startsWith("p-")) { const [, id, sub] = r.split("-"); html = viewProject(id, sub); tab = "projects"; }
  else if (r === "timeline") { html = viewTimeline(); tab = "timeline"; }
  else if (r === "crews") { html = viewCrews(); tab = "crews"; }
  else if (r === "setup") { html = viewSetup(); tab = "setup"; }
  else if (r === "money") html = viewMoney();
  else if (r === "alerts-all") html = viewAlertsAll();
  else html = viewHome();
  $("#app").innerHTML = noteBar() + html;
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}
window.addEventListener("hashchange", () => { closeSheet(); render(); window.scrollTo(0, 0); });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-close],[data-go],[data-edit],[data-act],[data-pf],[data-tl],[data-lang]");
  if (!el) return;
  if (el.dataset.close !== undefined) { if (e.target === el || el.tagName === "BUTTON") closeSheet(); return; }
  if (el.dataset.go) { const g = el.dataset.go; if (g === "#alerts") { const a = document.getElementById("alerts"); if (a) a.scrollIntoView({ behavior: "smooth" }); } else location.hash = g; return; }
  if (el.dataset.lang) { setLang(el.dataset.lang); return; }
  if (el.dataset.pf) { ui.projFilter = el.dataset.pf; render(); return; }
  if (el.dataset.tl) { ui.tlMode = el.dataset.tl; render(); return; }
  if (el.dataset.edit) { const k = el.dataset.edit; if (k === "crew") editCrew(el.dataset.id); else editItem(k, el.dataset.pid, el.dataset.id); return; }
  const a = el.dataset.act;
  if (a === "lang") setLang(LANG === "ar" ? "en" : "ar");
  else if (a === "newProject") editProject();
  else if (a === "editProject") editProject(el.dataset.pid);
  else if (a === "delProject") twoTap(el, () => { const id = el.dataset.pid; state.projects = state.projects.filter(p => p.id !== id); store.remove("p-" + id); location.hash = "#projects"; toast(t("Project deleted")); });
  else if (a === "add") editItem(el.dataset.kind, el.dataset.pid);
  else if (a === "todayReport") { const p = proj(el.dataset.pid); const r = (p.daily || []).find(x => x.date === TODAY_S); editItem("daily", p.id, r ? r.id : null); }
  else if (a === "addCrew") editCrew();
  else if (a === "loadSample") twoTap(el, loadSample);
  else if (a === "export") exportBackup();
  else if (a === "import") $("#importFile").click();
  else if (a === "wipe") twoTap(el, wipe);
  else if (a === "copyExport") { const t = $("#exportText"); const done = () => toast(tx("Copied")); try { navigator.clipboard.writeText(t.value).then(done, () => { t.select(); toast(tx("Text selected: copy it")); }); } catch (err) { t.select(); } }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "importFile" && el.files[0]) { const fr = new FileReader(); fr.onload = () => importBackup(String(fr.result)); fr.readAsText(el.files[0]); el.value = ""; return; }
  const k = el.dataset.set; if (!k) return;
  if (k === "holidays") state.settings.holidays = el.value.split(/\s+/).map(x => x.trim()).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x));
  else if (k === "weekend") state.settings.weekend = el.value;
  else state.settings[k] = num(el.value);
  saveSettings(); toast(t("Saved"));
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheet) closeSheet(); });
let toastT = null;
function toast(msg) { let t = document.querySelector(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200); }

applyLang();
render();
store.init();
</script>
</body></html>
